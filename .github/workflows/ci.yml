name: CI

on:
  pull_request:
    branches: [personal]
  push:
    branches: [personal]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    permissions:
      contents: read
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v2

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Vendor/**') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: |
          set -o pipefail
          swift --version
          swift build --product Undertone 2>&1 | tee build.log
          # Vendored code is not ours to fix; any other warning fails the build.
          if grep -E "warning: " build.log | grep -v Vendor; then
            echo "::error::Build has warnings outside Vendor"
            exit 1
          fi

      - name: Test
        run: mise run test
