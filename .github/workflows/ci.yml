name: CI

on:
  pull_request:
    branches: [personal]
  push:
    branches: [personal]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    permissions:
      contents: read
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # restore-mtime needs each file's last commit, not just the tip's

      - uses: jdx/mise-action@v2

      # Checkout stamps every file with the current time, so a restored .build would recompile everything (54 files,
      # measured on this runner). Commit times are the same on every checkout, so unchanged files match the cache.
      - name: Restore source mtimes
        run: python3 -I scripts/restore-mtime.py

      # Build products only fit the compiler that made them, so the toolchain is part of the key. The source hash
      # gives every change its own entry; restore-keys falls back to the newest one, and SwiftPM rebuilds only what
      # differs. This workflow and the mtime script are hashed too: a change to how the cache is built must not
      # exact-hit (and so never replace) an entry built the old way.
      - name: Cache key
        id: key
        run: |
          swift --version
          echo "toolchain=$(swift --version 2>&1 | shasum -a 256 | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.toolchain }}-${{ hashFiles('Package.swift', 'Sources/**', 'Vendor/**', 'scripts/restore-mtime.py', '.github/workflows/ci.yml') }}
          restore-keys: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.toolchain }}-

      - name: Build
        run: |
          set -o pipefail
          swift build --product Undertone 2>&1 | tee build.log
          # Vendored code is not ours to fix; any other warning fails the build.
          if grep -E "warning: " build.log | grep -v Vendor; then
            echo "::error::Build has warnings outside Vendor"
            exit 1
          fi

      - name: Test
        run: mise run test

      # Only pushes to personal save. PR runs can read personal's caches but not each other's, so a cache saved
      # from a PR would only take up space (about 90 MB each, against the repo's 10 GB limit).
      - name: Save build cache
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build
          key: ${{ steps.cache.outputs.cache-primary-key }}
